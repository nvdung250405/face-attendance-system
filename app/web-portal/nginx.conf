# ==============================================================================
# CẤU HÌNH REVERSE PROXY NGINX CHO WEB PORTAL (TASK-WEB-031, FND-WEB-006, DD-WEB-008, DD-WEB-010)
# Phục vụ Bundle SPA React, Định tuyến /api và /ws-attendance sang Backend, Triệt tiêu lỗi CORS.
# ==============================================================================

# Ánh xạ nâng cấp giao thức kết nối WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cụm máy chủ dịch vụ backend nội bộ Docker Compose
upstream backend_upstream {
    server fas-backend:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Nén Gzip tĩnh (FND-WEB-005)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Bảo mật HTTP headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # 1. Reverse Proxy Chuyển tiếp REST API sang Backend (/api/)
    # Giải quyết triệt để rào cản CORS thông qua kiến trúc Same-Origin
    # --------------------------------------------------------------------------
    location /api/ {
        # Xử lý CORS Preflight Request (OPTIONS)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Kiosk-Id' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Chuyển tiếp request tới Backend Spring Boot
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Bảo toàn thông tin định danh và host của client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình timeouts kết nối backend
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
    }

    # --------------------------------------------------------------------------
    # 2. Reverse Proxy STOMP WebSocket Kênh Điểm danh (/ws-attendance)
    # Hỗ trợ nâng cấp giao thức WSS / WS và duy trì kết nối bền vững
    # --------------------------------------------------------------------------
    location /ws-attendance {
        proxy_pass http://backend_upstream/ws-attendance;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers (bắt buộc để không bị ngắt kết nối STOMP)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Giữ kết nối WebSocket không bị ngắt quãng giữa các nhịp ping STOMP (1 giờ)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 3. Reverse Proxy WebSocket Dự phòng (/ws)
    # --------------------------------------------------------------------------
    location /ws {
        proxy_pass http://backend_upstream/ws;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 4. Static Assets Cache Tối ưu (assets/ với immutable cache 1 năm)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 5. SPA Routing Fallback: Mọi URI không trùng file tĩnh đều trả về /index.html
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Không cache index.html để client luôn nhận bundle mới nhất khi phát hành
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # --------------------------------------------------------------------------
    # 6. Endpoint Kiểm tra Sức khỏe Nginx Container (Healthcheck)
    # --------------------------------------------------------------------------
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
