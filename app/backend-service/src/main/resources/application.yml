# ==============================================================================
# FAS BACKEND SERVICE CONFIGURATION
# ==============================================================================

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: backend-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fas_db}}
    username: ${DB_USER:fas_admin}
    password: ${DB_PASSWORD:SecurePassword_FAS_2026!}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Cấu hình đa luồng ảo Java 21 (Virtual Threads - Project Loom)
  threads:
    virtual:
      enabled: true

# ==============================================================================
# CẤU HÌNH NGHIỆP VỤ & BẢO MẬT HỆ THỐNG CHẤM CÔNG (FAS)
# ==============================================================================
fas:
  security:
    jwt-secret: ${JWT_SECRET:4a8f9c2d1e0b5a7c3e6d8f1a2b4c6e8d0f2a4b6c8e0d2f4a6b8c0d2e4f6a8b0c}
    jwt-expiration-hours: 8
    encryption-master-key: ${ENCRYPTION_MASTER_KEY:9f8e7d6c5b4a3a2b1c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b}

  kiosk:
    secret-token: ${KIOSK_SECRET_TOKEN:Kiosk_Internal_Secret_Token_2026}

  attendance:
    cooldown-seconds: ${COOLDOWN_SECONDS:120}
    grace-period-minutes: 15

  compliance:
    data-retention-days: ${COMPLIANCE_DATA_RETENTION_DAYS:20}

# Giám sát sức khỏe Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
