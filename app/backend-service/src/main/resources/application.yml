# ==============================================================================
# FAS BACKEND SERVICE CONFIGURATION
# ==============================================================================

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: backend-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fas_db}}
    username: ${DB_USER:fas_admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Cấu hình đa luồng ảo Java 21 (Virtual Threads - Project Loom)
  threads:
    virtual:
      enabled: true

# ==============================================================================
# CẤU HÌNH NGHIỆP VỤ & BẢO MẬT HỆ THỐNG CHẤM CÔNG (FAS)
# ==============================================================================
fas:
  security:
    # BẮT BUỘC cấp qua biến môi trường (không có giá trị mặc định trong mã nguồn để tránh lộ khóa)
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-hours: 1
    encryption-master-key: ${ENCRYPTION_MASTER_KEY}

  kiosk:
    secret-token: ${KIOSK_SECRET_TOKEN:Kiosk_Internal_Secret_Token_2026}

  attendance:
    cooldown-seconds: ${COOLDOWN_SECONDS:120}
    grace-period-minutes: 15

  compliance:
    data-retention-days: ${COMPLIANCE_DATA_RETENTION_DAYS:20}

# Giám sát sức khỏe Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
