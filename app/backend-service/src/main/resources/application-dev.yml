# ==============================================================================
# FAS BACKEND SERVICE - DEVELOPMENT PROFILE CONFIGURATION
# ==============================================================================

server:
  port: ${SERVER_PORT:8080}

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

fas:
  security:
    jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:8}
    cors:
      allowed-origins: ${FAS_CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
