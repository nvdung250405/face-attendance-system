        reason:
          type: string
          description: Diễn giải lý do vi phạm ràng buộc
          example: punchTimestamp không được để trống
    ProblemDetails:
      type: object
      description: Cấu trúc phản hồi lỗi chuẩn RFC 9457 (thay thế RFC 7807) ProblemDetails
      properties:
        type:
          type: string
          format: uri
          description: URI định danh loại lỗi
          example: https://fas.company.com/errors/validation-failed
        title:
          type: string
          description: Tiêu đề ngắn gọn của loại lỗi
          example: Dữ liệu không hợp lệ
        status:
          type: integer
          format: int32
          description: Mã trạng thái HTTP tương ứng
          example: 400
        detail:
          type: string
          description: Chi tiết nguyên nhân lỗi cụ thể
          example: Dữ liệu request không thỏa mãn ràng buộc.
        instance:
          type: string
          format: uri
          description: URI tài nguyên phát sinh lỗi
          example: https://fas.company.com/api/v1/kiosk/punch
        code:
          type: string
          description: Mã lỗi nghiệp vụ nội bộ của FAS
          example: VALIDATION_FAILED
        message:
          type: string
          description: Thông điệp diễn giải lỗi cho người dùng
          example: Dữ liệu request không thỏa mãn ràng buộc.
        timestamp:
          type: string
          format: date-time
          description: Mốc thời gian phát sinh lỗi theo chuẩn ISO-8601 (+07:00)
          example: '2026-11-16T10:30:00+07:00'
        invalidParams:
          type: array
          description: Danh sách trường dữ liệu vi phạm ràng buộc (nếu có)
          items:
            $ref: '#/components/schemas/InvalidParam'
