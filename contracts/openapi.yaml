openapi: 3.1.0
info:
  title: Face Attendance System API
  description: Tài liệu đặc tả REST API cho Hệ thống Điểm danh Khuôn mặt (Face Attendance
    System)
  contact:
    name: Engineering Team
    email: dev@fas.local
  license:
    name: Proprietary
    url: https://fas.local/license
  version: 1.0.0
servers:
- url: http://localhost
  description: Generated server url
security:
- bearerAuth: []
