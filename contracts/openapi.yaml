components:
  schemas:
    ApiResponseVoid:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          type: object
        timestamp:
          type: string
          format: date-time
    KioskVerifyPinRequest:
      type: object
      properties:
        employeeCode:
          type: string
        pin:
          type: string
          pattern: \d{6}
      required:
        - employeeCode
        - pin
    ApiResponsePinVerificationResult:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/PinVerificationResult'
        timestamp:
          type: string
          format: date-time
    PinVerificationResult:
      type: object
      properties:
        employeeId:
          type: integer
          format: int64
        employeeCode:
          type: string
        fullName:
          type: string
        department:
          type: string
    KioskVerifyOtpRequest:
      type: object
      properties:
        otp:
          type: string
          pattern: \d{6}
      required:
        - otp
    ApiResponseOtpVerificationResult:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/OtpVerificationResult'
        timestamp:
          type: string
          format: date-time
    OtpVerificationResult:
      type: object
      properties:
        sessionToken:
          type: string
        employeeId:
          type: integer
          format: int64
        employeeCode:
          type: string
        fullName:
          type: string
        department:
          type: string
    KioskSyncBatchRequest:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/OfflinePunchRecord'
          maxItems: 50
          minItems: 0
      required:
        - records
    OfflinePunchRecord:
      type: object
      properties:
        localQueueId:
          type: integer
          format: int64
        employeeId:
          type: integer
          format: int64
        punchTimestamp:
          type: string
          format: date-time
        verificationMethod:
          type: string
          pattern: VERIFICATION_FACE|VERIFICATION_PIN
        confidenceScore:
          type: number
          maximum: 1
          minimum: 0
      required:
        - employeeId
        - localQueueId
        - punchTimestamp
        - verificationMethod
    ApiResponseBatchSyncResult:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/BatchSyncResult'
        timestamp:
          type: string
          format: date-time
