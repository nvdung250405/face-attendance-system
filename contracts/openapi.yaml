    bearerAuth:
      type: http
      description: Nhập Bearer Token nhận được từ /api/v1/auth/login
      scheme: bearer
      bearerFormat: JWT
    kioskTokenAuth:
      type: apiKey
      in: header
      name: X-Kiosk-Token
      description: Token xác thực chuyên dụng cho trạm Kiosk Edge (KioskTokenAuthenticationFilter)
    kioskIdAuth:
      type: apiKey
      in: header
      name: X-Kiosk-Id
      description: Mã định danh trạm Kiosk trong hệ thống
    kioskSecretAuth:
      type: apiKey
      in: header
      name: X-Kiosk-Secret
      description: Mã khóa bí mật của trạm Kiosk để xác thực an toàn
