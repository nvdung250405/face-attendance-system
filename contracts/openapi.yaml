openapi: 3.0.3
info:
  title: Face Attendance System API
  description: Tài liệu đặc tả REST API cho Hệ thống Điểm danh Khuôn mặt (Face Attendance System)
  contact:
    name: Engineering Team
    email: dev@fas.local
  license:
    name: Proprietary
    url: https://fas.local/license
  version: 1.0.0
servers:
  - url: /
    description: Base API Gateway Endpoint
security:
  - bearerAuth: []
paths:
  /api/v1/notifications/read-all:
    post:
      tags:
        - notification-controller
      summary: Mark all as read
      operationId: markAllAsRead
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '400':
          description: Dữ liệu không hợp lệ (RFC 9457 ProblemDetails / VALIDATION_FAILED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Chưa xác thực hoặc token không hợp lệ (UNAUTHORIZED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Không đủ quyền truy cập tài nguyên (ACCESS_DENIED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Không tìm thấy tài nguyên được yêu cầu (RESOURCE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Xung đột dữ liệu hoặc bản ghi đã tồn tại (CONFLICT)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Lỗi hệ thống nội bộ (INTERNAL_SERVER_ERROR)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
