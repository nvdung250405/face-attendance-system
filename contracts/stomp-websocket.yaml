# ==============================================================================
# Centralized Realtime Interface Contract: STOMP 1.2 Protocol over WebSocket
# Stage: 3. Architecture & Centralized Contracts (workflows/full-sdlc.md)
# System: Enterprise Face Attendance System (FAS)
# Verification: python scripts/verify_contracts.py --dir contracts
# ==============================================================================

protocol: "STOMP"
version: "1.2"
transport: "WebSocket"
endpoint: "/ws-attendance"
endpoints:
  - path: "/ws"
    transport: "WebSocket"
    client: "Edge Kiosk (Python STOMP Client)"
    description: "Native WebSocket STOMP endpoint trực tiếp cho trạm Kiosk Edge"
  - path: "/ws-attendance"
    transport: "SockJS / WebSocket"
    client: "Web Portal (Browser React Client)"
    description: "SockJS fallback endpoint cho trình duyệt Cổng Web Quản trị"

info:
  title: "Enterprise Face Attendance Realtime STOMP Interface"
  description: |
    Defines destinations, message payloads, and channel semantics for real-time
    attendance broadcasting, guided enrollment onboarding synchronization, and
    edge biometric gallery distribution across Web Portal and Edge Kiosks.
  version: "1.0.0"

connection:
  heartbeat:
    client_send_interval_ms: 10000
    server_send_interval_ms: 10000
  headers:
    connect:
      required:
        - "accept-version"
        - "host"
      optional:
        - "Authorization" # Bearer JWT token cho Web Portal / Employee session
        - "X-Kiosk-Id"    # Mã định danh trạm Kiosk trong kết nối STOMP của Kiosk
        - "X-Kiosk-Secret" # Khóa bí mật xác thực trạm Kiosk (ROLE_KIOSK)
  security:
    type: "composite_token_or_kiosk_secret"
    passcode_header: "Authorization"
    kiosk_id_header: "X-Kiosk-Id"
    kiosk_secret_header: "X-Kiosk-Secret"

destinations:
  # Server -> Client Broadcast Channels
  outbound:
    - address: "/topic/live-attendance"
      summary: "Broadcast stream of validated attendance punches to Web Portal Live Dashboard"
      command: "SUBSCRIBE"
      ack_mode: "auto"
      security:
        roles: ["ROLE_ADMIN", "ROLE_HR_MANAGER"]
        description: "Authenticated administrative and HR monitoring sessions only."
      message_payload:
        $ref: "#/components/schemas/LiveAttendanceEvent"

    - address: "/topic/enrollment/{otp}"
      summary: "Dynamic channel notifying Web Portal of successful 3-pose face enrollment by OTP"
      command: "SUBSCRIBE"
      ack_mode: "auto"
      security:
        authorization: "Session authenticated user matching active OTP owner or ROLE_ADMIN"
        description: "Protected dynamic channel. Backend STOMP Channel Interceptor validates subscription session against OTP ownership to prevent unauthorized channel eavesdropping."
      message_payload:
        $ref: "#/components/schemas/EnrollmentSuccessEvent"

    - address: "/topic/kiosk-gallery"
      summary: "Broadcast vector updates and gallery hot-patch sync commands to active Edge Kiosks"
      command: "SUBSCRIBE"
      ack_mode: "auto"
      security:
        roles: ["ROLE_KIOSK"]
        description: "Authenticated edge kiosk devices only."
      message_payload:
        $ref: "#/components/schemas/GalleryUpdateEvent"

    - address: "/topic/kiosk-status"
      summary: "Broadcast real-time online/offline connectivity status updates of Edge Kiosks"
      command: "SUBSCRIBE"
      ack_mode: "auto"
      security:
        roles: ["ROLE_ADMIN", "ROLE_HR_MANAGER"]
        description: "Administrative monitoring of edge fleet status."
      message_payload:
        $ref: "#/components/schemas/KioskStatusEvent"

  # Client -> Server Inbound Channels
  inbound:
    - address: "/app/heartbeat"
      summary: "Client-initiated diagnostic application ping (Optional; transport heartbeats enforced at STOMP level 10s/10s)"
      command: "SEND"
      security:
        roles: ["ROLE_KIOSK", "ROLE_EMPLOYEE", "ROLE_ADMIN"]
        description: "Lightweight diagnostic ping; native channel liveness is maintained by STOMP transport heartbeat frame."

  # System Error Handling
  error:
    command: "ERROR"
    headers:
      required:
        - "message"
    payload:
      $ref: "#/components/schemas/StompErrorPayload"

components:
  schemas:
    LiveAttendanceEvent:
      type: "object"
      required:
        - "recordId"
        - "employeeId"
        - "employeeCode"
        - "fullName"
        - "punchTimestamp"
        - "punchType"
        - "verificationMethod"
        - "status"
        - "kioskId"
      properties:
        eventType:
          type: "string"
          example: "ATTENDANCE_PUNCHED"
        recordId:
          type: "integer"
          format: "int64"
          example: 98232
        employeeId:
          type: "integer"
          format: "int64"
          example: 1048
        employeeCode:
          type: "string"
          example: "EMP-00128"
        fullName:
          type: "string"
          example: "Nguyen Van A"
        department:
          type: "string"
          nullable: true
          example: "Ky thuat & R&D"
        kioskId:
          type: "string"
          example: "KSK-01"
        punchTimestamp:
          type: "string"
          format: "date-time"
          example: "2026-10-13T08:47:00.000+07:00"
        punchType:
          type: "string"
          enum: ["CHECK_IN", "CHECK_OUT"]
          example: "CHECK_IN"
        verificationMethod:
          type: "string"
          enum: ["VERIFICATION_FACE", "VERIFICATION_PIN", "MANUAL_HR", "FACE_MATCH", "FALLBACK_PIN", "HR_OVERRIDE"]
          example: "VERIFICATION_FACE"
        status:
          type: "string"
          enum: ["ON_TIME", "LATE", "EARLY_LEAVE", "OVERTIME", "ANOMALOUS"]
          example: "ON_TIME"
        lateMinutes:
          type: "integer"
          format: "int32"
          example: 0
        overtimeMinutes:
          type: "integer"
          format: "int32"
          description: "Số phút làm thêm giờ lượng tử hóa sau ca làm việc"
          example: 30
        isOfflineSync:
          type: "boolean"
          default: false
          description: "Đánh dấu lượt điểm danh đồng bộ từ hàng đợi ngoại tuyến"

    EnrollmentSuccessEvent:
      type: "object"
      required:
        - "status"
        - "otp"
        - "employeeId"
        - "activatedAt"
      properties:
        status:
          type: "string"
          example: "ENROLLMENT_SUCCESS"
        otp:
          type: "string"
          example: "847291"
        employeeId:
          type: "integer"
          format: "int64"
          example: 1048
        employeeCode:
          type: "string"
          example: "EMP-00128"
        fullName:
          type: "string"
          example: "Nguyen Van A"
        templateCount:
          type: "integer"
          example: 3
        poses:
          type: "array"
          items:
            type: "string"
            enum: ["FRONTAL", "LEFT_TILT", "RIGHT_TILT"]
        message:
          type: "string"
          example: "Đăng ký khuôn mặt thành công"
        activatedAt:
          type: "string"
          format: "date-time"
          example: "2026-10-13T08:45:00.000+07:00"

    EnrollmentCompletedEvent:
      $ref: "#/components/schemas/EnrollmentSuccessEvent"

    GalleryUpdateEvent:
      type: "object"
      required:
        - "action"
        - "employeeId"
        - "updatedAt"
      properties:
        action:
          type: "string"
          enum: ["ADD_VECTOR", "DELETE_VECTOR"]
          example: "ADD_VECTOR"
        employeeId:
          type: "integer"
          format: "int64"
          example: 1048
        employeeCode:
          type: "string"
          description: "Mã nhân viên (chỉ có ở lệnh ADD_VECTOR)"
          example: "EMP-00128"
        fullName:
          type: "string"
          description: "Họ tên nhân viên (chỉ có ở lệnh ADD_VECTOR)"
          example: "Nguyen Van A"
        vector512:
          type: "array"
          description: "Vector đặc trưng FRONTAL 512D đã giải mã phục vụ tương thích ngược Kiosk cũ"
          items:
            type: "number"
            format: "float"
          minItems: 512
          maxItems: 512
        templates:
          type: "array"
          description: "Danh sách các mẫu khuôn mặt đa tư thế kèm vector 512 chiều"
          items:
            type: "object"
            required:
              - "poseType"
              - "vector512"
            properties:
              poseType:
                type: "string"
                enum: ["FRONTAL", "LEFT_TILT", "RIGHT_TILT"]
                example: "FRONTAL"
              vector512:
                type: "array"
                items:
                  type: "number"
                  format: "float"
                minItems: 512
                maxItems: 512
        reason:
          type: "string"
          description: "Lý do gỡ vector (chỉ có ở lệnh DELETE_VECTOR)"
          example: "Thu hồi chấp thuận sinh trắc theo Nghị định 13/2023"
        updatedAt:
          type: "string"
          format: "date-time"
          example: "2026-10-13T08:45:00.000+07:00"

    KioskStatusEvent:
      type: "object"
      required:
        - "kioskId"
        - "status"
        - "lastPingAt"
      properties:
        kioskId:
          type: "string"
          example: "KSK-01"
        status:
          type: "string"
          enum: ["ONLINE", "OFFLINE"]
          example: "ONLINE"
        lastPingAt:
          type: "string"
          format: "date-time"
          example: "2026-10-13T08:45:00.000+07:00"

    StompErrorPayload:
      type: "object"
      required:
        - "code"
        - "description"
      properties:
        code:
          type: "string"
          example: "UNAUTHORIZED_TOPIC"
        description:
          type: "string"
          example: "Client lacks permissions to subscribe to the requested destination."
