# ==============================================================================
# Centralized Realtime Interface Contract: STOMP 1.2 Protocol over WebSocket
# Stage: 3. Architecture & Centralized Contracts (workflows/full-sdlc.md)
# System: Enterprise Face Attendance System (FAS)
# Verification: python scripts/verify_contracts.py --dir contracts
# ==============================================================================

protocol: "STOMP"
version: "1.2"
transport: "WebSocket"
endpoint: "/ws-attendance"

info:
  title: "Enterprise Face Attendance Realtime STOMP Interface"
  description: |
    Defines destinations, message payloads, and channel semantics for real-time
    attendance broadcasting, guided enrollment onboarding synchronization, and
    edge biometric gallery distribution across Web Portal and Edge Kiosks.
  version: "1.0.0"

connection:
  heartbeat:
    client_send_interval_ms: 10000
    server_send_interval_ms: 10000
  headers:
    connect:
      required:
        - "accept-version"
        - "host"
      optional:
        - "Authorization" # Bearer JWT token for authenticated WebSocket connection
  security:
    type: "bearer_token"
    passcode_header: "Authorization"

destinations:
  # Server -> Client Broadcast Channels
  outbound:
    - address: "/topic/live-attendance"
      summary: "Broadcast stream of validated attendance punches to Web Portal Live Dashboard"
      command: "SUBSCRIBE"
      ack_mode: "auto"
      security:
        roles: ["ROLE_ADMIN", "ROLE_HR_MANAGER"]
        description: "Authenticated administrative and HR monitoring sessions only."
      message_payload:
        $ref: "#/components/schemas/LiveAttendanceEvent"

    - address: "/topic/enrollment/{otp}"
      summary: "Dynamic channel notifying Web Portal of successful 3-pose face enrollment by OTP"
      command: "SUBSCRIBE"
      ack_mode: "auto"
      security:
        authorization: "Session authenticated user matching active OTP owner or ROLE_ADMIN"
        description: "Protected dynamic channel. Backend STOMP Channel Interceptor validates subscription session against OTP ownership to prevent unauthorized channel eavesdropping."
      message_payload:
        $ref: "#/components/schemas/EnrollmentCompletedEvent"

    - address: "/topic/kiosk-gallery"
      summary: "Broadcast encrypted vector updates and gallery sync signals to active Edge Kiosks"
      command: "SUBSCRIBE"
      ack_mode: "auto"
      security:
        roles: ["ROLE_KIOSK"]
        description: "Authenticated edge kiosk devices only."
      message_payload:
        $ref: "#/components/schemas/KioskGallerySyncEvent"

  # Client -> Server Inbound Channels
  inbound:
    - address: "/app/heartbeat"
      summary: "Client-initiated application heartbeat and health ping"
      command: "SEND"
      security:
        roles: ["ROLE_KIOSK", "ROLE_EMPLOYEE", "ROLE_ADMIN"]
        description: "Lightweight application ping for latency tracking and channel health verification."

  # System Error Handling
  error:
    command: "ERROR"
    headers:
      required:
        - "message"
    payload:
      $ref: "#/components/schemas/StompErrorPayload"

components:
  schemas:
    LiveAttendanceEvent:
      type: "object"
      required:
        - "recordId"
        - "employeeId"
        - "employeeCode"
        - "fullName"
        - "department"
        - "punchTimestamp"
        - "punchType"
        - "verificationMethod"
        - "status"
        - "kioskId"
      properties:
        eventType:
          type: "string"
          example: "ATTENDANCE_PUNCHED"
        recordId:
          type: "integer"
          format: "int64"
          example: 98232
        employeeId:
          type: "integer"
          format: "int64"
          example: 1048
        employeeCode:
          type: "string"
          example: "EMP-00128"
        fullName:
          type: "string"
          example: "Nguyen Van A"
        department:
          type: "string"
          example: "Ky thuat & R&D"
        kioskId:
          type: "string"
          example: "KSK-01"
        punchTimestamp:
          type: "string"
          format: "date-time"
          example: "2026-10-13T08:47:00.000+07:00"
        punchType:
          type: "string"
          enum: ["CHECK_IN", "CHECK_OUT"]
          example: "CHECK_IN"
        verificationMethod:
          type: "string"
          enum: ["VERIFICATION_FACE", "VERIFICATION_PIN", "MANUAL_HR", "FACE_MATCH", "FALLBACK_PIN", "HR_OVERRIDE"]
          example: "VERIFICATION_FACE"
        status:
          type: "string"
          enum: ["ON_TIME", "LATE", "EARLY_LEAVE", "OVERTIME", "ANOMALOUS"]
          example: "ON_TIME"
        lateMinutes:
          type: "integer"
          example: 0

    EnrollmentCompletedEvent:
      type: "object"
      required:
        - "status"
        - "otp"
        - "employeeId"
        - "activatedAt"
      properties:
        status:
          type: "string"
          example: "ENROLLMENT_SUCCESS"
        otp:
          type: "string"
          example: "847291"
        employeeId:
          type: "integer"
          format: "int64"
          example: 1048
        employeeCode:
          type: "string"
          example: "EMP-00128"
        fullName:
          type: "string"
          example: "Nguyen Van A"
        templateCount:
          type: "integer"
          example: 3
        poses:
          type: "array"
          items:
            type: "string"
            enum: ["FRONTAL", "LEFT_TILT", "RIGHT_TILT"]
        message:
          type: "string"
          example: "Đăng ký khuôn mặt thành công"
        activatedAt:
          type: "string"
          format: "date-time"
          example: "2026-10-13T08:45:00.000+07:00"

    KioskGallerySyncEvent:
      type: "object"
      required:
        - "syncAction"
        - "employeeId"
        - "version"
        - "timestamp"
      properties:
        syncAction:
          type: "string"
          enum: ["UPSERT_TEMPLATES", "DELETE_TEMPLATES", "FULL_RESYNC"]
        employeeId:
          type: "string"
          format: "uuid"
        version:
          type: "integer"
        timestamp:
          type: "string"
          format: "date-time"

    StompErrorPayload:
      type: "object"
      required:
        - "code"
        - "description"
      properties:
        code:
          type: "string"
          example: "UNAUTHORIZED_TOPIC"
        description:
          type: "string"
          example: "Client lacks permissions to subscribe to the requested destination."

