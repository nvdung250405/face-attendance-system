# Evidence: DPL-001
# ==============================================================================
# Workflow Kiểm tra Toàn vẹn Tài liệu SDLC (github-docs.md mục 10.3)
# ==============================================================================
# Lưu ý (github-docs.md 10.2): workflow này là required check nên KHÔNG dùng
# path filter hoặc branch filter ở cấp workflow. Logic "bỏ qua khi PR không
# đụng docs/**" được đặt ở điều kiện cấp job (job `detect-changes`).
# ==============================================================================

name: Docs Check

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect relevant file changes
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for docs/contracts/scripts changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'contracts/**'
              - '.github/**'
              - 'scripts/**'

  docs-check:
    name: SDLC Documentation Validation (docs-check)
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate Machine-Executable Contracts
        run: |
          python -c "import yaml, json, glob; [yaml.safe_load(open(f, encoding='utf-8')) for f in glob.glob('contracts/*.yaml')]; [json.load(open(f, encoding='utf-8')) for f in glob.glob('contracts/*.json')]; print('All contracts syntax valid')"
