# Evidence: DPL-001
# ==============================================================================
# Workflow Kiểm tra Toàn vẹn Tài liệu SDLC (github-docs.md mục 10.3)
# ==============================================================================
# Lưu ý (github-docs.md 10.2): workflow này là required check nên KHÔNG dùng
# path filter hoặc branch filter ở cấp workflow. Logic "bỏ qua khi PR không
# đụng docs/**" được đặt ở điều kiện cấp job (job `detect-changes`).
# ==============================================================================

name: Docs Check

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect relevant file changes
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for docs/github/tools changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/**'
              - '.github/**'
              - 'tools/**'

  docs-check:
    name: SDLC Documentation Validation (docs-check)
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    env:
      # Cho phép kiểm tra change control (sdlc-docs.md §12.3): leaf `Baselined`
      # bị sửa trong pull request phải tăng `version`.
      DOCS_CHECK_BASE_REF: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SDLC Docs Integrity Check
        run: python tools/docs-check/check_docs.py --matrix docs-traceability-matrix.md

      - name: Upload traceability matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-traceability-matrix
          path: docs-traceability-matrix.md
          if-no-files-found: ignore
