# Evidence: DPL-001
# ==============================================================================
# FAS Monorepo CI Pipeline - Enterprise Grade Maximization
# Tuân thủ: AGENTS.md, docs/github-docs.md mục 10, ISO 27001 & OWASP SAMM
# ==============================================================================

name: FAS Monorepo CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # 0. Phân luồng thay đổi Monorepo Thông Minh (Path Filtering)
  # ----------------------------------------------------------------------------
  changes:
    name: Detect Affected Components
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      database: ${{ steps.filter.outputs.database }}
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      kiosk: ${{ steps.filter.outputs.kiosk }}
      security: ${{ steps.filter.outputs.security }}
      ci_config: ${{ steps.filter.outputs.ci_config }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            contracts:
              - 'contracts/**'
            database:
              - 'database/**'
              - 'app/backend-service/src/main/resources/db/migration/**'
            backend:
              - 'app/backend-service/**'
              - 'database/**'
              - 'contracts/**'
            web:
              - 'app/web-portal/**'
              - 'tests/web-portal/**'
              - 'contracts/**'
            kiosk:
              - 'app/kiosk-app/**'
              - 'tests/desktop-kiosk/**'
              - 'contracts/**'
            security:
              - 'app/**'
              - 'database/**'
            ci_config:
              - '.github/**'

  # ----------------------------------------------------------------------------
  # 0.1 Kiểm Định Cú Pháp CI & YAML (CI Workflow Syntax Validation)
  # ----------------------------------------------------------------------------
  ci-syntax-check:
    name: CI Workflow Syntax Validation
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.ci_config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for YAML validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate GitHub Actions YAML syntax
        run: |
          python -c "
          import glob, yaml, sys
          files = glob.glob('.github/**/*.yml', recursive=True) + glob.glob('.github/**/*.yaml', recursive=True)
          errors = 0
          for f in files:
              try:
                  with open(f, 'r', encoding='utf-8') as fp:
                      yaml.safe_load(fp)
              except Exception as e:
                  print(f'ERROR: {f} syntax invalid: {e}')
                  errors += 1
          if errors > 0:
              sys.exit(1)
          print(f'Validated {len(files)} GitHub workflow/config files successfully.')
          "

  # ----------------------------------------------------------------------------
  # 1. Kiểm Định Hợp Đồng Tập Trung (Contract Linting & Drift Check)
  # ----------------------------------------------------------------------------
  contract-ci:
    name: Contract Linting (Spectral OAS 3.0)
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for Spectral
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Validate OpenAPI with Spectral CLI
        run: |
          npx @stoplight/spectral-cli lint contracts/openapi.yaml

      - name: Validate JSON Schema & WebSocket Syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('contracts/data-contract.json', 'utf8')); console.log('JSON Schema valid.');"

  # ----------------------------------------------------------------------------
  # 2. Kiểm Định Tương Thích Cơ Sở Dữ Liệu Thực Tế (PostgreSQL 16 Parity)
  # ----------------------------------------------------------------------------
  db-parity-ci:
    name: Database Migration Parity (PostgreSQL 16)
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.database == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fas_db
          POSTGRES_USER: fas_admin
          POSTGRES_PASSWORD: SecurePassword_FAS_2026!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Grant execute permission for mvnw
        run: chmod +x app/backend-service/mvnw

      - name: Run Flyway Migration on Live PostgreSQL
        working-directory: app/backend-service
        run: |
          ./mvnw flyway:migrate "-Dflyway.url=jdbc:postgresql://localhost:5432/fas_db" "-Dflyway.user=fas_admin" "-Dflyway.password=SecurePassword_FAS_2026!"
          ./mvnw flyway:info "-Dflyway.url=jdbc:postgresql://localhost:5432/fas_db" "-Dflyway.user=fas_admin" "-Dflyway.password=SecurePassword_FAS_2026!"

      - name: Ingest Seeds & Verify Idempotent Cleanup
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD="SecurePassword_FAS_2026!" psql -h localhost -U fas_admin -d fas_db -f database/seeds/seed-staging-data.sql
          PGPASSWORD="SecurePassword_FAS_2026!" psql -h localhost -U fas_admin -d fas_db -f database/scripts/clean-db-data.sql
          echo "Database parity verified successfully!"

  # ----------------------------------------------------------------------------
  # 3. CI Phân Hệ Backend (Java 21 / Spring Boot + JaCoCo 80% Gate)
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend CI (Java 21 & JaCoCo Gate)
    permissions:
      contents: read
      checks: write
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Grant execute permission for mvnw
        run: chmod +x app/backend-service/mvnw

      - name: Checkstyle Validation
        working-directory: app/backend-service
        run: ./mvnw checkstyle:check

      - name: Compile & Run Tests with Coverage Enforcement
        working-directory: app/backend-service
        run: ./mvnw clean verify -B

      - name: Publish Backend Test Results (JUnit)
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Test Results
          path: app/backend-service/target/surefire-reports/*.xml
          reporter: java-junit

  # ----------------------------------------------------------------------------
  # 4. CI Phân Hệ Web Portal (React 19 / Vite / Vitest + Coverage)
  # ----------------------------------------------------------------------------
  web-portal-ci:
    name: Web Portal CI (React 19 / Vitest)
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: http://localhost:8080
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: app/web-portal/package-lock.json

      - name: Install dependencies
        working-directory: app/web-portal
        run: npm ci

      - name: Strict Linting (Zero Bypass)
        working-directory: app/web-portal
        run: npm run lint -- --max-warnings 0

      - name: TypeScript Type Checking
        working-directory: app/web-portal
        run: npx tsc -b --noEmit

      - name: Run Unit & Component Tests (Vitest + Coverage)
        working-directory: app/web-portal
        run: npm test -- --coverage

      - name: NPM Dependency Audit
        working-directory: app/web-portal
        run: npm audit --audit-level=high

      - name: Build Web Production Bundle
        working-directory: app/web-portal
        run: npm run build

  # ----------------------------------------------------------------------------
  # 5. CI Phân Hệ Kiosk Desktop (Python 3.11 / PySide6 / Pytest)
  # ----------------------------------------------------------------------------
  kiosk-app-ci:
    name: Kiosk Desktop CI (Python 3.11)
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.kiosk == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: app/kiosk-app/requirements*.txt

      - name: Install Linux GUI Libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        working-directory: app/kiosk-app
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pip-audit

      - name: Run Ruff Lint & Format Check
        working-directory: app/kiosk-app
        run: |
          ruff check .
          ruff format --check .

      - name: Python Dependency Audit
        working-directory: app/kiosk-app
        run: pip-audit --strict

      - name: Run Unit Tests with Coverage (Offscreen Qt)
        working-directory: app/kiosk-app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -v --cov=src --cov-fail-under=75

  # ----------------------------------------------------------------------------
  # 6. CI Kiểm Thử Đầu Cuối Web Portal (Playwright E2E)
  # ----------------------------------------------------------------------------
  web-e2e-ci:
    name: Web Portal E2E (Playwright)
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: http://localhost:8080
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: app/web-portal/package-lock.json

      - name: Install dependencies
        working-directory: app/web-portal
        run: npm ci

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/web-portal/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: app/web-portal
        run: npx playwright install --with-deps chromium

      - name: Build Web Application
        working-directory: app/web-portal
        run: npm run build

      - name: Start Vite Preview Server
        working-directory: app/web-portal
        run: |
          npx vite preview --port 5173 &
          npx wait-on http://localhost:5173 --timeout 30000

      - name: Run Playwright E2E Tests (Adaptive Scope)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Executing Fast PR E2E Suite (Profile: desktop-chrome)..."
            node tests/web-portal/runner-e2e.mjs --config tests/web-portal/playwright.config.ts --project=desktop-chrome
          else
            echo "Executing Full Dual-Platform E2E Suite (Profiles: desktop-chrome + mobile-chrome)..."
            node tests/web-portal/runner-e2e.mjs --config tests/web-portal/playwright.config.ts
          fi

      - name: Upload E2E Test Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-e2e-artifacts
          path: |
            tests/reports/web-portal/
            tests/web-portal/test-results/

  # ----------------------------------------------------------------------------
  # 7. CI Quét An Toàn Bảo Mật (Semgrep SAST + Trivy Vulnerability & Secret)
  # ----------------------------------------------------------------------------
  security-scan:
    name: Security & SAST Scan (Semgrep + Trivy)
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for Security Tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST Scan with SARIF Output
        run: |
          semgrep scan \
            --config "p/owasp-top-ten" \
            --config "p/secrets" \
            --config "p/security-audit" \
            --config "p/python" \
            --config "p/javascript" \
            --config "p/typescript" \
            --config "p/react" \
            --config "p/java" \
            --severity ERROR \
            --error \
            --sarif --output semgrep.sarif \
            --exclude "node_modules" \
            --exclude ".venv" \
            --exclude "target" \
            --exclude "dist" \
            app

      - name: Upload Semgrep SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

      - name: Run Trivy Vulnerability & Secret Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'app'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          skip-dirs: '**/node_modules,**/.venv,**/target,**/dist'

  # ----------------------------------------------------------------------------
  # 8. Kiểm Định Định Dạng Tiêu Đề Pull Request (Conventional Commits)
  # ----------------------------------------------------------------------------
  pr-title-ci:
    name: Validate PR Title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title Format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Kiểm tra tiêu đề PR: $PR_TITLE"
          REGEX="^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?!?: .+"
          if [[ ! "$PR_TITLE" =~ $REGEX ]]; then
            echo "ERROR: Tiêu đề PR '$PR_TITLE' không đúng định dạng Conventional Commits!"
            echo "Định dạng hợp lệ: <type>(<SCOPE>): <subject> [<ID>]"
            exit 1
          fi
          echo "Tiêu đề PR hợp lệ!"

  # ----------------------------------------------------------------------------
  # 9. Cổng Tổng Hợp Kiểm Định Monorepo (ci-passed Gatekeeper)
  # ----------------------------------------------------------------------------
  ci-passed:
    name: Monorepo CI Aggregation (ci-passed)
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        pr-title-ci,
        ci-syntax-check,
        contract-ci,
        db-parity-ci,
        backend-ci,
        web-portal-ci,
        kiosk-app-ci,
        web-e2e-ci,
        security-scan,
      ]
    if: always()
    steps:
      - name: Evaluate Aggregated Results
        run: |
          echo "============================================================"
          echo "BÁO CÁO CỔNG KIỂM ĐỊNH TOÀN DIỆN MONOREPO CI (CI-PASSED)"
          echo "============================================================"
          echo "PR Title CI:      ${{ needs.pr-title-ci.result }}"
          echo "CI Syntax Check:  ${{ needs.ci-syntax-check.result }}"
          echo "Contract CI:      ${{ needs.contract-ci.result }}"
          echo "Database Parity:  ${{ needs.db-parity-ci.result }}"
          echo "Backend CI:       ${{ needs.backend-ci.result }}"
          echo "Web Portal CI:    ${{ needs.web-portal-ci.result }}"
          echo "Kiosk Desktop CI: ${{ needs.kiosk-app-ci.result }}"
          echo "Web E2E CI:       ${{ needs.web-e2e-ci.result }}"
          echo "Security Scan:    ${{ needs.security-scan.result }}"
          echo "============================================================"

          RESULTS=(
            "${{ needs.pr-title-ci.result }}"
            "${{ needs.ci-syntax-check.result }}"
            "${{ needs.contract-ci.result }}"
            "${{ needs.db-parity-ci.result }}"
            "${{ needs.backend-ci.result }}"
            "${{ needs.web-portal-ci.result }}"
            "${{ needs.kiosk-app-ci.result }}"
            "${{ needs.web-e2e-ci.result }}"
            "${{ needs.security-scan.result }}"
          )

          for res in "${RESULTS[@]}"; do
            if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
              echo "[FAIL] CỔNG CI THẤT BẠI: Phát hiện có công đoạn kiểm định bị gãy hoặc bị hủy bỏ!"
              exit 1
            fi
          done

          echo "[PASS] CỔNG CI THÀNH CÔNG: Toàn bộ kiểm thử, bảo mật và hợp đồng đạt tiêu chuẩn tuyệt đối!"

      - name: Generate Rich Step Summary Table
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # Báo Cáo Chất Lượng Bản Dựng FAS Monorepo CI

          | Phân Hệ / Chốt Kiểm Định | Kết Quả Thực Thi | Ghi Chú Kỹ Thuật |
          | :--- | :---: | :--- |
          | **PR Title Convention** | ${{ needs.pr-title-ci.result == 'success' && '[PASS]' || (needs.pr-title-ci.result == 'skipped' && '[SKIPPED]' || '[FAIL]') }} | Conventional Commits Pattern |
          | **CI Syntax Validation** | ${{ needs.ci-syntax-check.result == 'success' && '[PASS]' || (needs.ci-syntax-check.result == 'skipped' && '[SKIPPED]' || '[FAIL]') }} | GitHub Actions YAML Integrity |
          | **Contract Integrity** | ${{ needs.contract-ci.result == 'success' && '[PASS]' || (needs.contract-ci.result == 'skipped' && '[SKIPPED]' || '[FAIL]') }} | Spectral OAS 3.0 & JSON Schema |
          | **Database Parity** | ${{ needs.db-parity-ci.result == 'success' && '[PASS]' || (needs.db-parity-ci.result == 'skipped' && '[SKIPPED]' || '[FAIL]') }} | PostgreSQL 16 Flyway & Seeds Ingestion |
          | **Backend Service** | ${{ needs.backend-ci.result == 'success' && '[PASS]' || (needs.backend-ci.result == 'skipped' && '[SKIPPED]' || '[FAIL]') }} | Java 21, Checkstyle & JaCoCo >=80% |
          | **Web Portal** | ${{ needs.web-portal-ci.result == 'success' && '[PASS]' || (needs.web-portal-ci.result == 'skipped' && '[SKIPPED]' || '[FAIL]') }} | React 19, Strict ESLint & Vitest Coverage |
          | **Kiosk Desktop** | ${{ needs.kiosk-app-ci.result == 'success' && '[PASS]' || (needs.kiosk-app-ci.result == 'skipped' && '[SKIPPED]' || '[FAIL]') }} | Python 3.11, Ruff & Pytest Coverage |
          | **Web E2E Journeys** | ${{ needs.web-e2e-ci.result == 'success' && '[PASS]' || (needs.web-e2e-ci.result == 'skipped' && '[SKIPPED]' || '[FAIL]') }} | Playwright (PR: Desktop, Push: Dual-Platform) |
          | **Security & SAST** | ${{ needs.security-scan.result == 'success' && '[PASS]' || (needs.security-scan.result == 'skipped' && '[SKIPPED]' || '[FAIL]') }} | Semgrep SARIF & Trivy Vulnerability Scan |

          > **Trạng thái cổng tích hợp:** `ci-passed` sẵn sàng phục vụ quy tắc Branch Protection (`main`, `develop`).
          EOF
