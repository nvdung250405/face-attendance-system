name: FAS Monorepo CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. CI Kiểm tra Máy chủ Backend (Java 21 / Spring Boot + PostgreSQL Service)
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend Service CI (Java 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fas_db
          POSTGRES_USER: fas_admin
          POSTGRES_PASSWORD: SecurePassword_FAS_2026!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: fas_db
      DB_USER: fas_admin
      DB_PASSWORD: SecurePassword_FAS_2026!
      JWT_SECRET: 4a8f9c2d1e0b5a7c3e6d8f1a2b4c6e8d0f2a4b6c8e0d2f4a6b8c0d2e4f6a8b0c
      ENCRYPTION_MASTER_KEY: 9f8e7d6c5b4a3a2b1c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x app/backend-service/mvnw

      - name: Compile and Run Unit Tests
        working-directory: app/backend-service
        run: ./mvnw clean test

  # ----------------------------------------------------------------------------
  # 2. CI Kiểm tra Cổng Web Portal (ReactJS / Vite / TypeScript)
  # ----------------------------------------------------------------------------
  web-portal-ci:
    name: Web Portal CI (ReactJS / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: app/web-portal/package-lock.json

      - name: Install dependencies
        working-directory: app/web-portal
        run: npm ci

      - name: Check Linting & Type Checking
        working-directory: app/web-portal
        run: npm run lint || true

      - name: Build Web Production Bundle
        working-directory: app/web-portal
        run: npm run build

  # ----------------------------------------------------------------------------
  # 3. CI Kiểm tra Trạm Điểm danh Kiosk (Python AI / GUI)
  # ----------------------------------------------------------------------------
  kiosk-app-ci:
    name: Kiosk Desktop CI (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: app/kiosk-app/requirements.txt

      - name: Install dependencies
        working-directory: app/kiosk-app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Core Imports
        working-directory: app/kiosk-app
        run: |
          python -c "import cv2, onnxruntime, numpy, httpx, stomp; print('Core Vision & Network modules verified!')"
