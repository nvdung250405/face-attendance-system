# Evidence: DPL-001
# ==============================================================================
# FAS Monorepo CI Pipeline (Tuân thủ github-docs.md mục 10)
# ==============================================================================

name: FAS Monorepo CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ----------------------------------------------------------------------------
  # 0. Phân luồng thay đổi Monorepo (Path Filtering - github-docs.md 10.2)
  # ----------------------------------------------------------------------------
  changes:
    name: Detect Affected Services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      kiosk: ${{ steps.filter.outputs.kiosk }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'app/backend-service/**'
            web:
              - 'app/web-portal/**'
            kiosk:
              - 'app/kiosk-app/**'

  # ----------------------------------------------------------------------------
  # 1. CI Kiểm tra Máy chủ Backend (Java 21 / Spring Boot + PostgreSQL Service)
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend Service CI (Java 21)
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fas_db
          POSTGRES_USER: fas_admin
          POSTGRES_PASSWORD: SecurePassword_FAS_2026!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: fas_db
      DB_USER: fas_admin
      DB_PASSWORD: SecurePassword_FAS_2026!
      JWT_SECRET: 4a8f9c2d1e0b5a7c3e6d8f1a2b4c6e8d0f2a4b6c8e0d2f4a6b8c0d2e4f6a8b0c
      ENCRYPTION_MASTER_KEY: 9f8e7d6c5b4a3a2b1c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x app/backend-service/mvnw

      - name: Compile and Run Unit Tests
        working-directory: app/backend-service
        run: ./mvnw clean test

  # ----------------------------------------------------------------------------
  # 2. CI Kiểm tra Cổng Web Portal (ReactJS / Vite / TypeScript)
  # ----------------------------------------------------------------------------
  web-portal-ci:
    name: Web Portal CI (ReactJS / Vite)
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: app/web-portal/package-lock.json

      - name: Install dependencies
        working-directory: app/web-portal
        run: npm ci

      - name: Check Linting & Type Checking
        working-directory: app/web-portal
        run: npm run lint || true

      - name: Build Web Production Bundle
        working-directory: app/web-portal
        run: npm run build

  # ----------------------------------------------------------------------------
  # 3. CI Kiểm tra Trạm Điểm danh Kiosk (Python AI / GUI)
  # ----------------------------------------------------------------------------
  kiosk-app-ci:
    name: Kiosk Desktop CI (Python)
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.kiosk == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: app/kiosk-app/requirements.txt

      - name: Install Linux GUI Libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        working-directory: app/kiosk-app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Lint Check (Ruff)
        working-directory: app/kiosk-app
        run: ruff check .

      - name: Run Unit Tests (Pytest)
        working-directory: app/kiosk-app
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v

  # ----------------------------------------------------------------------------
  # 4. Job Tổng hợp Cổng kiểm định CI (ci-passed - github-docs.md 10.2)
  # ----------------------------------------------------------------------------
  ci-passed:
    name: Monorepo CI Aggregation (ci-passed)
    runs-on: ubuntu-latest
    needs: [changes, backend-ci, web-portal-ci, kiosk-app-ci]
    if: always()
    steps:
      - name: Evaluate Monorepo Status Checks
        run: |
          echo "============================================================"
          echo "BÁO CÁO TỔNG HỢP KIỂM TRA CI MONOREPO (CI-PASSED GATEWAY)"
          echo "============================================================"
          echo "Backend Service CI: ${{ needs.backend-ci.result }}"
          echo "Web Portal CI:      ${{ needs.web-portal-ci.result }}"
          echo "Kiosk Desktop CI:   ${{ needs.kiosk-app-ci.result }}"
          echo "============================================================"
          
          # Nếu bất kỳ job nào thất bại hoặc bị hủy -> Gatekeeper đánh rớt
          if [ "${{ needs.backend-ci.result }}" = "failure" ] || \
             [ "${{ needs.web-portal-ci.result }}" = "failure" ] || \
             [ "${{ needs.kiosk-app-ci.result }}" = "failure" ] || \
             [ "${{ needs.backend-ci.result }}" = "cancelled" ] || \
             [ "${{ needs.web-portal-ci.result }}" = "cancelled" ] || \
             [ "${{ needs.kiosk-app-ci.result }}" = "cancelled" ]; then
            echo "❌ CỔNG CI THẤT BẠI: Phát hiện có phân hệ không vượt qua kiểm định!"
            exit 1
          fi

          echo "✅ CỔNG CI THÀNH CÔNG: Mọi phân hệ hoạt động chuẩn xác hoặc được bỏ qua an toàn!"
