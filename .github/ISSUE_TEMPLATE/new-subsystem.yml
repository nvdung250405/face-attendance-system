name: "New Subsystem / Unit (Thêm Phân hệ Mới)"
description: "Quy trình đăng ký và khởi tạo phân hệ mới theo sdlc-docs.md mục 12.2."
title: "[NEW-SUBSYSTEM] <Tên phân hệ mới> (<SCOPE>)"
labels: ["new-subsystem"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🚀 Khởi tạo Phân hệ Mới
        *Mọi phân hệ mới trong kiến trúc Monorepo phải có mã SCOPE duy nhất và được phê duyệt kiến trúc tổng thể.*

  - type: input
    id: scope_code
    attributes:
      label: "Mã Subsystem Scope (2-4 ký tự in hoa)"
      description: "Ví dụ: REP (Reporting), NOT (Notification)."
      placeholder: "REP"
    validations:
      required: true

  - type: input
    id: service_name
    attributes:
      label: "Tên Phân hệ Đầy đủ"
      placeholder: "Phân hệ Báo cáo & Thống kê Tự động"
    validations:
      required: true

  - type: checkboxes
    id: architectural_approval
    attributes:
      label: "Phê duyệt Kiến trúc Tổng thể"
      options:
        - label: "Quyết định kiến trúc (`ARC-...`) bổ sung phân hệ này đã được Approved trong System Spec set (`system-docs/specs/spec.md`)"
          required: true

  - type: checkboxes
    id: required_facets
    attributes:
      label: "Các Thành phần Tài liệu Cần Thiết lập"
      description: "Cấu trúc chuẩn gồm specs/ và plans/; các facet tài liệu chọn theo trách nhiệm kỹ thuật (sdlc-docs.md §2, §7.2)."
      options:
        - label: "`specs/spec.md`, `specs/fr-nfr.md`, các plan trong `plans/` (Bắt buộc cho mọi phân hệ)"
          required: true
        - label: "`data` (`specs/data.md` nếu phân hệ quản lý CSDL / lưu trữ riêng)"
        - label: "`api` (`specs/api.md` nếu phân hệ cung cấp/tiêu thụ API contract)"
        - label: "`ui-ux` (`specs/ui-ux.md` nếu phân hệ có giao diện người dùng trực tiếp)"
