# ==============================================================================
# FAS BACKEND SERVICE - STAGING PROFILE CONFIGURATION
# ==============================================================================

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      idle-timeout: 30000
      connection-timeout: 20000
      leak-detection-threshold: 30000
      keepalive-time: 30000
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

fas:
  security:
    jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:2}
    cors:
      allowed-origins: ${FAS_CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
